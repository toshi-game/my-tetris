<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><title>ミニ・テトリス</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{height:100dvh;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:6px 12px 8px;gap:5px}h1{margin:0;font-size:24px}.info{font-size:15px}.area{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}canvas{height:auto;max-height:100%;width:auto;aspect-ratio:1/2;background:#080a10;border:4px solid #666;border-radius:7px;display:block}.controls{width:min(100%,600px);display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:none}button{height:55px;border:0;border-radius:14px;background:#30333b;color:#fff;font-size:29px;font-weight:700}button:active{transform:scale(.97)}.start{width:min(100%,600px);height:48px;font-size:18px;flex:none}.help{font-size:11px;opacity:.6}@media(max-height:700px){h1{font-size:19px}.info{font-size:13px}button{height:43px;font-size:24px}.start{height:39px;font-size:15px}.help{display:none}}
</style></head><body><div class="app"><h1>ミニ・テトリス</h1><div class="info">スコア <span id="s">0</span>　ライン <span id="l">0</span>　レベル <span id="v">1</span></div><div class="area"><canvas id="c" width="300" height="600"></canvas></div><div class="controls"><button onclick="mv(-1)">←</button><button onclick="rot()">↻</button><button onclick="mv(1)">→</button><button onclick="soft()">↓</button><button onclick="hard()">⇩</button><button onclick="pause()">Ⅱ</button></div><button class="start" onclick="start()">スタート / リスタート</button><div class="help">← → 移動　↑ 回転　↓ 落下　Space 一気に落とす</div></div>
<script>
const C=document.getElementById('c'),x=C.getContext('2d'),W=10,H=20,N=30,col=['','#4dc9ff','#ffd43b','#a66cff','#ff5b5b','#4ee38a','#ff9f43','#5c7cfa'],sh=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[4,0,0],[4,4,4]],[[0,5,5],[5,5,0]],[[0,0,6],[6,6,6]],[[7,7,0],[0,7,7]]];let b,p,sc=0,li=0,lv=1,run=0,pa=0,t=0,last=0;
function start(){b=Array.from({length:H},()=>Array(W).fill(0));sc=li=0;lv=1;info();newp();pa=0;run=1;last=performance.now();requestAnimationFrame(loop)}
function newp(){let m=sh[Math.random()*sh.length|0];p={m:m.map(r=>r.slice()),x:(W-m[0].length)/2|0,y:0};if(hit(p.m,p.x,p.y)){run=0;alert('ゲームオーバー！')}}
function hit(m,X,Y){for(let r=0;r<m.length;r++)for(let q=0;q<m[r].length;q++)if(m[r][q]){let a=X+q,z=Y+r;if(a<0||a>=W||z>=H||(z>=0&&b[z][a]))return 1}return 0}
function mv(d){if(run&&!pa&&!hit(p.m,p.x+d,p.y))p.x+=d}
function soft(){if(!run||pa)return;if(!hit(p.m,p.x,p.y+1))p.y++;else merge();t=0}
function hard(){if(!run||pa)return;while(!hit(p.m,p.x,p.y+1))p.y++;merge();t=0}
function rot(){if(!run||pa)return;let m=p.m,h=m.length,w=m[0].length,n=Array.from({length:w},(_,r)=>Array.from({length:h},(_,q)=>m[h-1-q][r]));for(let d of [0,-1,1,-2,2])if(!hit(n,p.x+d,p.y)){p.m=n;p.x+=d;return}}
function merge(){p.m.forEach((r,R)=>r.forEach((v,q)=>{if(v)b[p.y+R][p.x+q]=v}));let n=0;for(let r=H-1;r>=0;r--)if(b[r].every(Boolean)){b.splice(r,1);b.unshift(Array(W).fill(0));n++;r++}if(n){li+=n;sc+=[0,100,300,500,800][n]*lv;lv=1+li/10|0;info()}newp()}
function info(){s.textContent=sc;l.textContent=li;v.textContent=lv}
function draw(){x.clearRect(0,0,300,600);x.strokeStyle='#111625';for(let i=0;i<=W;i++){x.beginPath();x.moveTo(i*N,0);x.lineTo(i*N,600);x.stroke()}for(let i=0;i<=H;i++){x.beginPath();x.moveTo(0,i*N);x.lineTo(300,i*N);x.stroke()}if(b)b.forEach((r,R)=>r.forEach((v,q)=>v&&cell(q,R,v)));if(p)p.m.forEach((r,R)=>r.forEach((v,q)=>v&&cell(p.x+q,p.y+R,v)))}
function cell(a,z,v){x.fillStyle=col[v];x.fillRect(a*N+1,z*N+1,N-2,N-2)}
function loop(now){if(!run){draw();return}let dt=now-last;last=now;if(!pa){t+=dt;if(t>=Math.max(100,700-(lv-1)*55))soft()}draw();requestAnimationFrame(loop)}
function pause(){if(run){pa=!pa;event.currentTarget.textContent=pa?'▶':'Ⅱ'}}
document.onkeydown=e=>{if(e.key==='ArrowLeft')mv(-1);if(e.key==='ArrowRight')mv(1);if(e.key==='ArrowDown')soft();if(e.key==='ArrowUp')rot();if(e.code==='Space'){e.preventDefault();hard()}if(e.key.toLowerCase()==='p')pause()};
b=Array.from({length:H},()=>Array(W).fill(0));draw();info();
</script></body></html>
